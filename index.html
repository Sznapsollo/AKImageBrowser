<!doctype html>
<html lang="en">

<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="all">
<meta name="revisit-after" content="3 days">
<meta name="distribution" content="global">
<meta name="description" content="AKImageBrowser - quick deployable web image browser/gallery." />
<meta name="keywords" content="AKImageBrowser, Sznapsollo, Web gallery, image gallery" />
<meta name="homepage" content="https://github.com/Sznapsollo/AKImageBrowser">

<script defer src="inc/libs/vue_3.0.2.global.prod.js"></script>
<script defer src="inc/libs/vue-router.global_4_0_8.prod.js"></script>
<script defer src="inc/libs/mitt.umd.js"></script>
<script defer src="inc/fancybox4/fancybox.umd.js"></script>
<script defer src="inc/js/settings.js"></script>
<script defer src="inc/js/skrypty.js"></script>
<script defer src="inc/js/app.js"></script>
<script defer src="inc/js/components/imagesViewer.js"></script>
<script defer src="inc/js/components/aboutComponent.js"></script>
<script defer src="inc/js/components/homeComponent.js"></script>
<script defer src="inc/js/components/settingsComponent.js"></script>
<script defer src="inc/js/components/pagerComponent.js"></script>
<script defer src="inc/js/routes.js"></script>
<script defer src="inc/js/main.js"></script>

<link rel="stylesheet" type="text/css" href="inc/fancybox4/fancybox.css" media="screen" />
<link href="inc/css/cascade.css" rel="stylesheet" type="text/css">
<link href="inc/css/section.css" rel="stylesheet" type="text/css">
<link rel="icon" href="inc/favicon.png" type="image/png">

<title>AKImageBrowser</title>

</head>

<body id="app">
	<div id="pageWrapper">
		<button type="button" id="return-to-top">Top</button>

		<nav class="navbar">
			<a class="navbar-brand pointer" @click="redirectToMain()">AKImageBrowser</a>
			<ul class="navbar-nav">
				<li class="nav-item pointer"><a class="nav-link" @click="showSettings()">Options</a></li>
				<li class="nav-item" v-bind:class="{ active: $route.name=='about'}">
					<router-link :to="{ name: 'about' }" class="nav-link">About</router-link>
				</li>
			</ul>
		</nav>

		<div id="mainContainer">
			<div id="middleSection">
				<div class="inner">
					<router-view v-slot="{ Component }">
						<keep-alive>
							<component :is="Component" />
						</keep-alive>
					</router-view>
				</div>
			</div>
		</div>

		<settings-component></settings-component>

		<a class="githubLink" href="https://github.com/Sznapsollo/AKImageBrowser" target="_blank">AKImageBrowser v{{version}} - github page</a>
	</div>
</body>

</html>
