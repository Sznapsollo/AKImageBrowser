<!doctype html>
<html lang="en">

<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="AKImageBrowser - quick deployable web image browser/gallery." />
<meta name="homepage" content="https://github.com/Sznapsollo/AKImageBrowser">

<script>try { var akibTheme = localStorage.getItem('theme'); if(akibTheme === 'light' || akibTheme === 'dark') { document.documentElement.setAttribute('data-theme', akibTheme); } } catch(e) {}</script>

<script defer src="inc/libs/vue_3.2.47.global.prod.js"></script>
<script defer src="inc/libs/vue-router.global_4_2_5.prod.js"></script>
<script defer src="inc/libs/mitt.umd.js"></script>
<script defer src="inc/fancybox4/fancybox.umd.js"></script>
<script defer src="inc/js/settings.js"></script>
<script defer src="inc/js/i18n.js"></script>
<script defer src="inc/js/skrypty.js"></script>
<script defer src="inc/js/app.js"></script>
<script defer src="inc/js/components/imagesViewer.js"></script>
<script defer src="inc/js/components/aboutComponent.js"></script>
<script defer src="inc/js/components/settingsComponent.js"></script>
<script defer src="inc/js/components/pagerComponent.js"></script>
<script defer src="inc/js/routes.js"></script>
<script defer src="inc/js/main.js"></script>

<link rel="stylesheet" type="text/css" href="inc/fancybox4/fancybox.css" media="screen" />
<link href="inc/css/cascade.css" rel="stylesheet" type="text/css">
<link rel="icon" href="inc/favicon.png" type="image/png">

<title>AKImageBrowser</title>

</head>

<body id="app">
	<div id="pageWrapper">
		<button type="button" id="return-to-top">{{ t('nav.top') }}</button>

		<nav class="navbar">
			<a class="navbar-brand pointer" @click="redirectToMain()" title="AKImageBrowser"><span class="brandShort">AKIB</span><span class="brandFull">AKImageBrowser</span></a>
			<ul class="navbar-nav">
				<li class="nav-item themeSwitch" role="group" :aria-label="t('theme.group')">
					<button type="button" class="themeButton" v-bind:class="{ active: prefs.theme === 'light' }" v-bind:aria-pressed="prefs.theme === 'light'" @click="setTheme('light')" :title="t('theme.light')" :aria-label="t('theme.light')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"><path d="M8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm0 1a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0zm0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13zm8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5zM3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8zm10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0zm-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0zm9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707zM4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708z"/></svg></button>
					<button type="button" class="themeButton" v-bind:class="{ active: prefs.theme === 'auto' }" v-bind:aria-pressed="prefs.theme === 'auto'" @click="setTheme('auto')" :title="t('theme.auto')" :aria-label="t('theme.auto')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"><path d="M8 15A7 7 0 1 0 8 1v14zm0 1A8 8 0 1 1 8 0a8 8 0 0 1 0 16z"/></svg></button>
					<button type="button" class="themeButton" v-bind:class="{ active: prefs.theme === 'dark' }" v-bind:aria-pressed="prefs.theme === 'dark'" @click="setTheme('dark')" :title="t('theme.dark')" :aria-label="t('theme.dark')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"><path d="M6 .278a.768.768 0 0 1 .08.858 7.208 7.208 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277.527 0 1.04-.055 1.533-.16a.787.787 0 0 1 .81.316.733.733 0 0 1-.031.893A8.349 8.349 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.752.752 0 0 1 6 .278z"/></svg></button>
				</li>
				<li class="nav-item pointer"><a class="nav-link" href="#" @click.prevent="showSettings()">{{ t('nav.options') }}</a></li>
				<li class="nav-item" v-bind:class="{ active: $route.name=='about'}">
					<router-link :to="{ name: 'about' }" class="nav-link">{{ t('nav.about') }}</router-link>
				</li>
			</ul>
		</nav>

		<div id="mainContainer">
			<div id="middleSection">
				<div class="inner">
					<router-view v-slot="{ Component }">
						<keep-alive>
							<component :is="Component" />
						</keep-alive>
					</router-view>
				</div>
			</div>
		</div>

		<settings-component></settings-component>

		<footer class="pageFooter">
			<a href="https://github.com/Sznapsollo/AKImageBrowser" target="_blank" rel="noopener" :title="t('footer.title')">
				<span class="footerShort">AKIB</span>
				<span class="footerFull">AKImageBrowser v{{version}} · GitHub</span>
			</a>
		</footer>
	</div>
</body>

</html>
