name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: git archive -o "AKImageBrowser-${GITHUB_REF_NAME}.zip" HEAD index.html inc
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "AKImageBrowser-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --generate-notes
